kind = "web"
previewPath = "/"
title = "Your Name Portfolio"
description = "A clean personal portfolio for a beginner web designer and app builder, showcasing local-business websites, quote calculators, and contact-focused services."
version = "1.0.0"
id = "artifacts/your-name-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20602

[services.development]
run = "pnpm --filter @workspace/your-name-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/your-name-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/your-name-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20602"
BASE_PATH = "/"
